<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2540">
<title>Fotos SUP y Eventos</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#0b1b2b;--muted:#5d6d7e;--line:#e1e6eb;
  --brand:#0b2540;--brand-ink:#fff;--brand2:#0b2540;--accent:#ff5a36;--accent-ink:#fff;
  --ok:#11875a;--okbg:#e5f5ee;--warn:#9a6a00;--warnbg:#fff4d6;--bad:#c22f2f;--badbg:#fdeaea;
  --r:14px;--shadow:0 1px 2px rgba(11,27,43,.06),0 4px 16px rgba(11,27,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--brand2)}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;line-height:1.2;min-height:44px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:7px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=datetime-local],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:transparent}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px}
label.f>span{display:block;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:9px;min-width:0;font-weight:800;font-size:18px;color:var(--brand-ink);text-decoration:none;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo img{height:36px;width:auto;max-width:110px;object-fit:contain;flex:none}
.logo span{overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.logo img+span{display:none}}
.logo b{color:var(--accent)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{color:color-mix(in srgb,var(--brand-ink) 78%,transparent);text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.main a.on,nav.main a:hover{color:var(--brand-ink);background:color-mix(in srgb,var(--brand-ink) 12%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 0 rgba(255,59,59,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.cart-pill{background:var(--accent);color:var(--accent-ink)!important;border-radius:999px!important;padding:6px 12px!important}
@media(max-width:600px){nav.main a .lbl{display:none} nav.main a{padding:8px}}

/* hero */
.hero{background:linear-gradient(160deg,var(--brand) 0%,color-mix(in srgb,var(--brand) 72%,#fff) 100%);color:var(--brand-ink);padding:44px 0 56px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hero .hero-logo{height:84px;width:auto;max-width:240px;object-fit:contain;margin-bottom:14px}
.hero h1{font-size:clamp(28px,6vw,46px);font-weight:850;max-width:720px}
.hero p{color:color-mix(in srgb,var(--brand-ink) 85%,transparent);font-size:17px;max-width:600px;margin:0 0 22px}
.live-banner{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:20px;max-width:560px;text-decoration:none;box-shadow:var(--shadow)}
.live-banner b{color:#d61f1f}

/* events */
.section{padding:22px 0 40px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:36px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ev{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s}
.ev:hover{transform:translateY(-2px)}
.ev .cov{aspect-ratio:3/2;background:#cfd8e1 center/cover no-repeat;position:relative}
.ev .kind{position:absolute;top:10px;left:10px;background:color-mix(in srgb,var(--brand) 88%,transparent);color:var(--brand-ink);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.ev .bd{padding:12px 14px 14px}
.ev h3{font-size:17px;margin:0 0 4px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* gallery */
.ev-head{padding:22px 0 10px}
.ev-head h1{font-size:clamp(24px,5vw,34px)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.tools .search{flex:1 1 220px;position:relative}
.tools .search input{padding-left:38px}
.tools .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
@media(max-width:480px){.gal{grid-template-columns:repeat(2,1fr);gap:6px}}
.ph{position:relative;aspect-ratio:3/2;border-radius:10px;overflow:hidden;background:#d5dde5;cursor:pointer;-webkit-touch-callout:none;user-select:none}
.ph img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph .sel{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ph.on{outline:3px solid var(--accent);outline-offset:-3px}
.ph.on .sel{background:var(--accent);border-color:var(--accent)}
.ph .sel svg{opacity:0}.ph.on .sel svg{opacity:1}
.ph .bib{position:absolute;left:7px;bottom:7px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--brand);color:var(--brand-ink);padding:10px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15);transform:translateY(110%);visibility:hidden;transition:transform .2s,visibility .2s}
.cartbar.show{transform:none;visibility:visible}
.cartbar .wrap{display:flex;align-items:center;gap:12px}
.pad-cart{height:80px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,12,20,.94);display:flex;flex-direction:column}
.lb .bar{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff}
.lb .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 8px}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:none;user-select:none;pointer-events:none}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:22px}
.lb .nav.l{left:10px}.lb .nav.r{right:10px}
.lb .foot{padding:12px 12px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center;color:#cdd8e3;flex-wrap:wrap}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:20px}

/* cart / checkout */
.layout2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.layout2{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mini .ph{border-radius:8px}
.mini .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.sum{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.sum.tot{font-size:20px;font-weight:800;border:0;padding-top:10px}
.pay{background:#f0f6fc;border:1px solid #cfe3f5;border-radius:12px;padding:14px;margin:14px 0}
.pay .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pay .v{font-size:17px;font-weight:750;word-break:break-all}
.copy{margin-left:auto}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:#fafbfc}
.drop.has{border-color:var(--ok);background:var(--okbg)}

/* status */
.badge{display:inline-block;font-size:12px;font-weight:750;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.b-pendiente{background:var(--warnbg);color:var(--warn)}
.b-aprobado{background:var(--okbg);color:var(--ok)}
.b-rechazado{background:var(--badbg);color:var(--bad)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dl a{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.dl a span{display:block;padding:8px 10px;font-size:13px;font-weight:650}

/* live */
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.offair{aspect-ratio:16/9;border-radius:var(--r);background:linear-gradient(160deg,var(--brand),color-mix(in srgb,var(--brand) 72%,#fff));color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.sched{list-style:none;padding:0;margin:0}
.sched li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sched .d{background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:6px 10px;text-align:center;min-width:58px;font-weight:800;line-height:1.1}
.sched .d small{display:block;font-weight:600;font-size:11px;opacity:.8;text-transform:uppercase}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0;padding-bottom:2px}
.tabs button{border:0;background:#fff;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.tabs button.on{background:var(--brand);color:var(--brand-ink)}
.order{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.order .thumbs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.order .thumbs img{width:64px;height:43px;object-fit:cover;border-radius:5px}
.order .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media(max-width:560px){.order{grid-template-columns:1fr}.order .acts{flex-direction:row;flex-wrap:wrap}}
.aph{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.aph .it{background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.aph .it img{aspect-ratio:3/2;object-fit:cover;width:100%}
.aph .it .b{padding:8px;display:flex;flex-direction:column;gap:6px}
.aph .it input{min-height:36px;padding:6px 9px;font-size:13px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,12,20,.6);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal{align-items:center}}
.modal .sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.modal .sheet{border-radius:18px}}
.selfie-prev{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:6px auto 12px;display:block;border:3px solid var(--line)}
.facebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--okbg);border:1px solid #bfe5d2;color:#0b5c3d;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.btn.face{background:#fff;color:var(--brand);border:1px solid var(--line)}
.switch{display:flex;align-items:center;gap:10px;font-weight:650;margin-bottom:12px;cursor:pointer}
.switch input{width:20px;height:20px}
.about{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:28px;align-items:center}
@media(max-width:700px){.about{grid-template-columns:1fr;gap:18px}}
.about .pic{width:100%;max-width:260px;aspect-ratio:4/5;object-fit:cover;border-radius:18px;box-shadow:var(--shadow)}
.about .pic.ph{background:linear-gradient(160deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;color:var(--brand-ink);font-size:64px;font-weight:800}
.about h2{font-size:clamp(24px,4.5vw,34px)}
.about .txt p{margin:0 0 12px;max-width:62ch}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}
.tags span{background:color-mix(in srgb,var(--accent) 14%,#fff);color:color-mix(in srgb,var(--accent) 70%,#000);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650}
.teaser{display:flex;gap:16px;align-items:center}
.teaser img,.teaser .ph{width:86px;height:86px;border-radius:50%;object-fit:cover;flex:none}
.teaser .ph{background:linear-gradient(160deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;color:var(--brand-ink);font-weight:800;font-size:28px}
.teaser p{margin:4px 0 8px;color:var(--muted)}
.cta{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:22px;margin-top:22px}
.cta h3{margin-bottom:6px}
.cta p{margin:0 0 14px;opacity:.85}
.brandprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brandprev img{height:56px;width:auto;max-width:160px;object-fit:contain;background:var(--brand);padding:6px;border-radius:10px}
.colorrow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.colorrow label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.colorrow input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
footer{padding:28px 0 36px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);margin-top:20px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a href="#/" class="logo" id="logo">Fotos</a>
    <nav class="main" id="nav"></nav>
  </div>
</header>
<main id="app"><div class="spin"></div></main>
<footer><div class="wrap row" id="foot"></div></footer>
<div id="cartbar" class="cartbar"><div class="wrap"><div><b id="cbN">0 fotos</b><div class="small" style="opacity:.8" id="cbT"></div></div><div class="sp"></div><a href="#/carrito" class="btn accent">Ver pedido →</a></div></div>

<script>
/* =====================================================================
   CONFIG — completar con los datos del proyecto Supabase.
   (La anon key es pública por diseño; la seguridad está en RLS.)
   Si se dejan vacíos, la web corre en MODO DEMO.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: ''
};

const DEMO = !CONFIG.SUPABASE_URL;
const ABOUT_DEFAULT = {
  tags: 'Competencias de SUP, Eventos, Transmisiones en vivo',
  text: 'Soy fotógrafo independiente. Recorro las competencias de stand up paddle para que cada remador tenga sus mejores fotos, y también cubro eventos sociales y deportivos.\n\nAdemás transmito en vivo las competencias, para que familia y amigos las sigan desde donde estén.\n\nSi querés que cubra tu evento, escribime y lo charlamos.'
};
const U = CONFIG.SUPABASE_URL.replace(/\/$/, '');
const K = CONFIG.SUPABASE_ANON_KEY;

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(+n || 0).toLocaleString('es-AR');
const digits = s => String(s || '').replace(/\D/g, '');
const fmtDate = d => d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('es-AR', {day:'numeric', month:'long', year:'numeric'}) : '';
const fmtDT = d => new Date(d).toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random()*16|0).toString(16)));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function toast(msg, ms = 2600) {
  $$('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado: ' + text); }
  catch { prompt('Copiá:', text); }
}
const ICON = {
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  cart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg>',
  live: '<span class="dot"></span>',
  cam: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  user: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
};

/* Precio: total = min( ⌊n/k⌋·P + (n mod k)·p , ⌈n/k⌉·P ) — igual que en el servidor */
function calcTotal(n, s, ev) {
  const p = ev && ev.price_photo != null && ev.price_photo !== '' ? +ev.price_photo : +s.price_photo || 0;
  const k = +s.pack_size || 0, P = +s.pack_price || 0;
  if (k > 1 && P > 0) return Math.min(Math.floor(n / k) * P + (n % k) * p, Math.ceil(n / k) * P);
  return n * p;
}
function priceText(s, ev) {
  const p = ev && ev.price_photo != null && ev.price_photo !== '' ? +ev.price_photo : +s.price_photo || 0;
  let t = money(p) + ' por foto';
  if (+s.pack_size > 1 && +s.pack_price > 0) t += ` · Pack ${s.pack_size} fotos ${money(s.pack_price)}`;
  return t;
}

/* ---------- imagen: resize + marca de agua (en el navegador del fotógrafo) ---------- */
function drawWatermark(ctx, w, h, text) {
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-Math.PI / 7);
  const fs = Math.max(14, Math.round(Math.min(w, h) / 16));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${fs}px system-ui,sans-serif`;
  ctx.lineWidth = Math.max(1, fs / 16);
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.fillStyle = 'rgba(255,255,255,.30)';
  const stepX = ctx.measureText(text).width + fs * 2.2, stepY = fs * 3, R = Math.hypot(w, h);
  for (let y = -R, row = 0; y < R; y += stepY, row++) {
    const off = (row % 2) * stepX / 2;
    for (let x = -R; x < R; x += stepX) { ctx.strokeText(text, x + off, y); ctx.fillText(text, x + off, y); }
  }
  ctx.font = `800 ${fs * 2.3}px system-ui,sans-serif`;
  ctx.lineWidth = Math.max(1.5, fs / 10);
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.strokeText(text, 0, 0); ctx.fillText(text, 0, 0);
  ctx.restore();
}
function renderTo(src, maxSide, wm, quality = .74) {
  const sw = src.width, sh = src.height, s = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
  if (wm) drawWatermark(x, c.width, c.height, wm);
  return new Promise(r => c.toBlob(r, 'image/jpeg', quality));
}
async function decodeFile(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {}
  }
  const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode(); return img;
}
async function makeVersions(file, wm, faceOpts) {
  const src = await decodeFile(file);
  const thumb = await renderTo(src, 640, wm, .7);
  const preview = await renderTo(src, 1400, wm, .74);
  let faces = null;
  if (faceOpts) { try { faces = await FACE.detectAll(src, faceOpts); } catch (e) { console.error('faces', e); } }
  if (src.close) src.close();
  return { thumb, preview, faces };
}

/* =====================================================================
   RECONOCIMIENTO FACIAL (face-api, alojado en /vendor, carga diferida)
   - Fotógrafo: al subir, detecta TODAS las caras (SSD MobileNet) y
     guarda un descriptor de 128 números por cara.
   - Cliente: la selfie se procesa EN SU CELULAR (detector liviano) y
     solo viaja el descriptor; la imagen no se sube ni se guarda.
   - Comparación: distancia euclídea d = ‖a − b‖₂ ; misma persona si d < umbral.
   ===================================================================== */
const FACE = {
  BASE: 'vendor/face-api/',
  THRESHOLD: 0.55,   // face-api recomienda 0.6; 0.55 = más estricto (menos falsos positivos)
  _lib: null, _nets: {},
  loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el reconocimiento facial')); document.head.appendChild(s); });
  },
  async lib() {
    if (!this._lib) this._lib = (async () => {
      if (!window.faceapi) await this.loadScript(this.BASE + 'face-api.js');
      await faceapi.tf.ready();
      return faceapi;
    })().catch(e => { this._lib = null; throw e; }); // si falla, se reintenta la próxima vez
    return this._lib;
  },
  async nets(names) {
    const fa = await this.lib(), M = this.BASE + 'model';
    await Promise.all(names.map(n => this._nets[n] || (this._nets[n] = fa.nets[n].loadFromUri(M)
      .catch(() => { delete this._nets[n]; throw new Error('No se pudo cargar el reconocimiento facial. Revisá la conexión y probá de nuevo.'); }))));
    return fa;
  },
  toCanvas(src, maxSide) {
    const s = Math.min(1, maxSide / Math.max(src.width, src.height));
    const c = document.createElement('canvas'); c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
  },
  crop(c, x, y, w, h) {
    const o = document.createElement('canvas'); o.width = w; o.height = h;
    o.getContext('2d').drawImage(c, x, y, w, h, 0, 0, w, h); return o;
  },
  /* Todas las caras de una foto del evento. tiles=true agrega 4 recortes
     superpuestos para encontrar caras chicas (remadores lejos). */
  async detectAll(src, { tiles = false } = {}) {
    const fa = await this.nets(['ssdMobilenetv1', 'faceLandmark68Net', 'faceRecognitionNet']);
    const c = this.toCanvas(src, tiles ? 2400 : 1600);
    const opt = new fa.SsdMobilenetv1Options({ minConfidence: 0.5, maxResults: 30 });
    const regions = [[0, 0, c.width, c.height]];
    if (tiles) {
      const tw = Math.round(c.width * .6), th = Math.round(c.height * .6);
      for (const [x, y] of [[0, 0], [c.width - tw, 0], [0, c.height - th], [c.width - tw, c.height - th]]) regions.push([x, y, tw, th]);
    }
    const found = [];
    for (const [x, y, w, h] of regions) {
      const input = (x === 0 && y === 0 && w === c.width && h === c.height) ? c : this.crop(c, x, y, w, h);
      const res = await fa.detectAllFaces(input, opt).withFaceLandmarks().withFaceDescriptors();
      for (const r of res) {
        const b = r.detection.box;
        if (b.width < 24) continue; // demasiado chica: descriptor poco confiable
        const box = { x: (b.x + x) / c.width, y: (b.y + y) / c.height, w: b.width / c.width, h: b.height / c.height };
        const dup = found.find(f => this.iou(f.box, box) > .4);
        if (dup) { if (r.detection.score > dup.score) Object.assign(dup, { box, score: r.detection.score, descriptor: Array.from(r.descriptor) }); continue; }
        found.push({ box, score: r.detection.score, descriptor: Array.from(r.descriptor) });
      }
    }
    return found;
  },
  iou(a, b) {
    const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y), x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
    const i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return i / (a.w * a.h + b.w * b.h - i || 1);
  },
  /* Selfie: una sola cara (la más grande), con detector liviano. */
  async selfie(src) {
    const fa = await this.nets(['tinyFaceDetector', 'faceLandmark68Net', 'faceRecognitionNet']);
    const c = this.toCanvas(src, 800);
    let r = await fa.detectSingleFace(c, new fa.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: .4 })).withFaceLandmarks().withFaceDescriptor();
    if (!r) { // segundo intento con el detector preciso, si ya está en caché o hace falta
      await this.nets(['ssdMobilenetv1']);
      r = await fa.detectSingleFace(c, new fa.SsdMobilenetv1Options({ minConfidence: .4 })).withFaceLandmarks().withFaceDescriptor();
    }
    return r ? Array.from(r.descriptor) : null;
  },
  dist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); },
  vec(d) { return '[' + d.map(v => v.toFixed(6)).join(',') + ']'; }
};
function blobToB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}

/* =====================================================================
   SUPABASE (REST directo con fetch, sin librerías)
   ===================================================================== */
const sb = {
  token: null, refresh: null, exp: 0,
  load() { try { const s = JSON.parse(sessionStorage.getItem('fsb') || 'null'); if (s) Object.assign(this, s); } catch {} },
  save(j) {
    this.token = j.access_token; this.refresh = j.refresh_token; this.exp = Date.now() + j.expires_in * 1000;
    try { sessionStorage.setItem('fsb', JSON.stringify({ token: this.token, refresh: this.refresh, exp: this.exp })); } catch {}
  },
  logout() { this.token = this.refresh = null; this.exp = 0; try { sessionStorage.removeItem('fsb'); } catch {} },
  async auth(grant, body) {
    const r = await fetch(`${U}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: K, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { if (grant === 'refresh_token') this.logout(); throw new Error(j.error_description || j.msg || 'Email o contraseña incorrectos'); }
    this.save(j);
  },
  async ensure() { if (this.refresh && Date.now() > this.exp - 60000) await this.auth('refresh_token', { refresh_token: this.refresh }); },
  hdr(extra = {}) { return { apikey: K, Authorization: 'Bearer ' + (this.token || K), ...extra }; },
  async q(path, opt = {}) {
    await this.ensure();
    const r = await fetch(`${U}/rest/v1/${path}`, { ...opt, headers: this.hdr({ 'Content-Type': 'application/json', Prefer: 'return=representation', ...(opt.headers || {}) }) });
    const t = await r.text();
    if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch {} throw new Error(m); }
    return t ? JSON.parse(t) : null;
  },
  async upload(bucket, path, blob) {
    await this.ensure();
    const r = await fetch(`${U}/storage/v1/object/${bucket}/${path}`, { method: 'POST', headers: this.hdr({ 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true', 'cache-control': '31536000' }), body: blob });
    if (!r.ok) throw new Error('Error subiendo archivo: ' + await r.text());
  },
  async remove(bucket, paths) {
    await this.ensure();
    await fetch(`${U}/storage/v1/object/${bucket}`, { method: 'DELETE', headers: this.hdr({ 'Content-Type': 'application/json' }), body: JSON.stringify({ prefixes: paths }) });
  },
  async sign(bucket, path, expiresIn = 300) {
    await this.ensure();
    const r = await fetch(`${U}/storage/v1/object/sign/${bucket}/${path}`, { method: 'POST', headers: this.hdr({ 'Content-Type': 'application/json' }), body: JSON.stringify({ expiresIn }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.message || 'No se pudo firmar');
    return `${U}/storage/v1${j.signedURL}`;
  },
  pub(path) { return `${U}/storage/v1/object/public/previews/${path}`; }
};

async function resizeImage(file, max, type = 'image/jpeg', q = .85) {
  const src = await decodeFile(file), s = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas'); c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); if (src.close) src.close();
  return new Promise(r => c.toBlob(r, type, q));
}
/* Luminancia relativa (WCAG): L = 0,2126·R + 0,7152·G + 0,0722·B, con canales linealizados */
function luminance(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  const n = parseInt(m[1], 16);
  const [r, g, b] = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * r + .7152 * g + .0722 * b;
}
function applyTheme() {
  const ok = h => /^#[0-9a-f]{6}$/i.test(h || '');
  const brand = ok(SET.color_primary) ? SET.color_primary : '#0b2540', accent = ok(SET.color_accent) ? SET.color_accent : '#ff5a36';
  const lb = luminance(brand), la = luminance(accent), st = document.documentElement.style;
  st.setProperty('--brand', brand); st.setProperty('--accent', accent);
  st.setProperty('--brand-ink', lb > .33 ? '#0b1b2b' : '#ffffff');   // texto legible sobre el color principal
  st.setProperty('--accent-ink', la > .4 ? '#0b1b2b' : '#ffffff');
  st.setProperty('--brand2', lb > .2 ? `color-mix(in srgb, ${brand} 55%, #000)` : brand); // links legibles sobre blanco
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = brand;
}

function toggleCart(eventId, pid) {
  if (cart.eventId && cart.eventId !== eventId && cart.ids.length) {
    if (!confirm('Tu pedido tiene fotos de otro evento. ¿Vaciarlo y empezar uno nuevo con este evento?')) return false;
    cart = { eventId, ids: [] };
  }
  cart.eventId = eventId;
  const i = cart.ids.indexOf(pid);
  if (i >= 0) cart.ids.splice(i, 1); else cart.ids.push(pid);
  saveCart(); return true;
}

let galState = { q: '', tag: '', faceEvent: null, faceIds: null };

  if (galState.faceEvent !== id) { galState.faceEvent = id; galState.faceIds = null; }

  const hasBibs = photos.some(p => p.bibs && p.bibs.length);
  $('#app').innerHTML = `
  <div class="wrap">
    <div class="ev-head">
      <a href="#/" class="small">← Todos los eventos</a>
      <h1 style="margin-top:8px">${esc(ev.title)}</h1>
      <div class="muted">${esc(fmtDate(ev.date))}${ev.location ? ' · ' + esc(ev.location) : ''} · ${photos.length} fotos</div>
      <div class="small" style="margin-top:6px"><b>${esc(priceText(SET, ev))}</b></div>
    </div>
    <div class="tools">
      <button class="btn face" id="selfieBtn">🤳 Buscame con una selfie</button>
      ${hasBibs ? `<div class="search">${ICON.search}<input type="text" inputmode="numeric" id="qBib" placeholder="Buscar por número de dorsal" value="${esc(galState.q)}"></div>` : ''}
      ${tags.length ? `<select id="qTag" style="flex:0 1 200px"><option value="">Todos los momentos</option>${tags.map(t => `<option ${galState.tag === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>` : ''}
    </div>
    <div id="faceBar"></div>

    <div class="gal" id="gal"></div>
    <div class="pad-cart"></div>
  </div>`;
  const draw = () => {
    const q = digits(galState.q), t = galState.tag, fi = galState.faceIds;
    let list = photos.filter(p => (!q || (p.bibs || []).some(b => digits(b) === q)) && (!t || p.tag === t));
    if (fi) { const rank = new Map(fi.map((x, i) => [x, i])); list = list.filter(p => rank.has(p.id)).sort((a, b) => rank.get(a.id) - rank.get(b.id)); }
    const fb = $('#faceBar');
    fb.innerHTML = fi ? `<div class="facebar"><b>🤳 ${fi.length ? `Te encontramos en ${fi.length} ${fi.length === 1 ? 'foto' : 'fotos'}` : 'No te encontramos con la selfie'}</b><span class="sp"></span>
      ${fi.length ? `<button class="btn sm ok" id="fAll">Agregar todas</button>` : ''}<button class="btn sm ghost" id="fClr">Ver todas las fotos</button></div>` : '';
    if (fi) {
      $('#fClr').onclick = () => { galState.faceIds = null; draw(); };
      const fa = $('#fAll'); if (fa) fa.onclick = () => {
        for (const pid of list.map(p => p.id)) if (!cart.ids.includes(pid) && !toggleCart(id, pid)) return;
        toast(`${list.length} fotos en tu pedido`); draw();
      };
    }
    const g = $('#gal');
    if (!list.length) { g.innerHTML = `<div class="empty" style="grid-column:1/-1">${fi ? 'Probá con otra selfie (de frente, con buena luz y sin anteojos) o buscá por dorsal.' : `No encontramos fotos${q ? ' con el dorsal ' + esc(q) : ''}. Probá con otro filtro.`}</div>`; return; }
    g.innerHTML = list.map(p => `
      <div class="ph ${cart.ids.includes(p.id) ? 'on' : ''}" data-id="${p.id}">
        <img loading="lazy" src="${api.thumb(p)}" alt="" draggable="false">
        <button class="sel" aria-label="Seleccionar">${ICON.check}</button>
        ${p.bibs && p.bibs.length ? `<span class="bib">#${esc(p.bibs.join(' #'))}</span>` : ''}
      </div>`).join('');
    $$('.ph', g).forEach(el => {
      el.addEventListener('contextmenu', e => e.preventDefault());
      el.onclick = e => {
        const pid = el.dataset.id;
        if (e.target.closest('.sel')) { if (toggleCart(id, pid)) el.classList.toggle('on', cart.ids.includes(pid)); return; }
        openLightbox(ev, list, list.findIndex(p => p.id === pid), () => draw());
      };
    });

  const qb = $('#qBib'); if (qb) qb.oninput = () => { galState.q = qb.value; draw(); };

function openSelfie(ev, onResult) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Buscar con selfie">
    <div class="row"><h2 style="margin:0">Buscame con una selfie</h2><span class="sp"></span><button class="iconbtn" style="background:var(--bg);color:var(--ink)" id="sX" aria-label="Cerrar">✕</button></div>
    <p class="small muted">Sacate una selfie de frente, con buena luz y sin anteojos ni gorra. Buscamos tu cara en las fotos de <b>${esc(ev.title)}</b>.</p>
    <div class="pay small" style="margin:10px 0">🔒 <b>Tu selfie no se sube a ningún lado.</b> Se analiza en tu celular, se convierte en una huella numérica que solo se usa para esta búsqueda y no se guarda.</div>
    <label class="switch small" style="font-weight:500;align-items:flex-start"><input type="checkbox" id="sOk" style="margin-top:2px"> <span>Acepto que se procese mi imagen facial solo para encontrar mis fotos en este evento.</span></label>
    <img id="sPrev" class="selfie-prev hidden" alt="">
    <div id="sMsg" class="small" style="text-align:center;min-height:20px;margin-bottom:10px"></div>
    <label class="btn accent block" id="sGo" style="cursor:pointer">📷 Sacar selfie o elegir foto<input type="file" id="sF" accept="image/*" capture="user" hidden></label>
  </div>`;
  document.body.appendChild(m); document.body.style.overflow = 'hidden';
  const close = () => { m.remove(); document.body.style.overflow = ''; };
  $('#sX', m).onclick = close; m.onclick = e => { if (e.target === m) close(); };
  const msg = (t, bad) => { const el = $('#sMsg', m); el.textContent = t; el.style.color = bad ? 'var(--bad)' : 'var(--muted)'; };
  const go = $('#sGo', m), fi = $('#sF', m);
  go.addEventListener('click', e => { if (!$('#sOk', m).checked) { e.preventDefault(); msg('Primero marcá la casilla de consentimiento.', true); } });
  FACE.nets(['tinyFaceDetector', 'faceLandmark68Net', 'faceRecognitionNet']).catch(() => {}); // precarga mientras lee
  fi.onchange = async () => {
    const file = fi.files[0]; if (!file) return;
    const url = URL.createObjectURL(file); const pv = $('#sPrev', m); pv.src = url; pv.classList.remove('hidden');
    go.style.pointerEvents = 'none'; go.style.opacity = '.5';
    try {
      msg('Preparando el reconocimiento (la primera vez tarda unos segundos)…');
      const src = await decodeFile(file);
      msg('Analizando tu cara…');
      const desc = await FACE.selfie(src); if (src.close) src.close();
      if (!desc) throw new Error('No encontramos una cara en la foto. Probá de frente, más cerca y con buena luz.');
      msg('Buscando en las fotos del evento…');
      const res = await api.matchFaces(ev.id, desc);
      close(); onResult(res.map(r => r.photo_id));
    } catch (e) { console.error(e); msg(e.message, true); go.style.pointerEvents = ''; go.style.opacity = ''; fi.value = ''; }
    finally { URL.revokeObjectURL(url); }
  };
}

function openLightbox(ev, list, idx, onClose) {
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `
    <div class="bar"><span id="lbI" class="small"></span><span class="sp"></span><button class="iconbtn" id="lbX" aria-label="Cerrar">✕</button></div>
    <div class="stage"><img id="lbImg" alt="" draggable="false"><button class="nav l" id="lbP" aria-label="Anterior">‹</button><button class="nav r" id="lbN" aria-label="Siguiente">›</button></div>
    <div class="foot"><span id="lbB" class="small"></span><button class="btn accent" id="lbS"></button></div>`;
  document.body.appendChild(lb); document.body.style.overflow = 'hidden';
  const show = () => {
    const p = list[idx]; const on = cart.ids.includes(p.id);
    $('#lbImg', lb).src = api.preview(p);
    $('#lbI', lb).textContent = `${idx + 1} / ${list.length}`;
    $('#lbB', lb).textContent = p.bibs && p.bibs.length ? 'Dorsal ' + p.bibs.join(', ') + (p.tag ? ' · ' + p.tag : '') : (p.tag || '');
    const b = $('#lbS', lb); b.textContent = on ? '✓ En tu pedido (quitar)' : '+ Agregar al pedido'; b.className = 'btn ' + (on ? 'ok' : 'accent');
  };
  const go = d => { idx = (idx + d + list.length) % list.length; show(); };
  const close = () => { lb.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', key); onClose && onClose(); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
  document.addEventListener('keydown', key);
  $('#lbX', lb).onclick = close; $('#lbP', lb).onclick = () => go(-1); $('#lbN', lb).onclick = () => go(1);
  $('#lbS', lb).onclick = () => { toggleCart(ev.id, list[idx].id); show(); };
  lb.addEventListener('contextmenu', e => e.preventDefault());
  let sx = null; const st = $('.stage', lb);
  st.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
  st.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); sx = null; });
  show();
}

  const fi = $('input[name=rc]'), drop = $('#drop');
  fi.onchange = () => { const f = fi.files[0]; drop.classList.toggle('has', !!f); $('#dropT').textContent = f ? '✓ ' + f.name : '📎 Adjuntá el comprobante'; };
  $('#chk').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, err = $('#err'); err.textContent = '';
    const name = f.name.value.trim(), phone = digits(f.phone.value), file = fi.files[0];
    if (name.length < 2) return err.textContent = 'Completá tu nombre.';
    if (phone.length < 8) return err.textContent = 'Completá un WhatsApp válido.';
    if (!file) return err.textContent = 'Adjuntá el comprobante de la transferencia.';
    const btn = $('#send'); btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      let blob = file, type = file.type;
      if (type.startsWith('image/')) { const src = await decodeFile(file); blob = await renderTo(src, 1600, null, .8); type = 'image/jpeg'; }
      else if (type !== 'application/pdf') throw new Error('Formato no soportado. Subí una imagen o PDF.');
      if (blob.size > 4.4 * 1024 * 1024) throw new Error('El archivo pesa demasiado (máx. 4 MB).');
      const res = await api.createOrder({ event_id: ev.id, photo_ids: cart.ids, name, phone: phone.length === 10 ? '549' + phone : phone, email: f.email.value.trim(), receipt: { data: await blobToB64(blob), type } });
      const mine = store.get('my_orders', []); mine.unshift({ token: res.token, event: ev.title, n, total: res.total, at: Date.now() }); store.set('my_orders', mine.slice(0, 20));
      cart = { eventId: null, ids: [] }; saveCart();
      location.hash = '#/pedido/' + res.token + '?nuevo=1';
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; btn.textContent = 'Enviar pedido'; }
  };
}

function ytEmbed(u) {
  if (!u) return null; let m;
  if ((m = u.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/))) return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&playsinline=1`;
  if ((m = u.match(/channel\/(UC[\w-]{22})/) || u.match(/^(UC[\w-]{22})$/))) return `https://www.youtube.com/embed/live_stream?channel=${m[1]}&autoplay=1&mute=1&playsinline=1`;
  return null;
}

          ${o.status === 'pendiente' ? `<button class="btn sm bad" data-rj="${o.id}">Rechazar</button>` : ''}

    adminOrders(pane);
  });

    </div>
    <div class="card">
      <div class="row" style="margin-bottom:10px"><h3 style="margin:0">${photos.length} fotos</h3><span class="sp"></span>
        ${photos.some(p => !p.faces_indexed) ? `<button class="btn sm" id="idx">🤳 Detectar caras (${photos.filter(p => !p.faces_indexed).length} pendientes)</button>` : ''}
        <a class="btn sm ghost" href="#/evento/${ev.id}" target="_blank">Ver como cliente</a></div>
      <div id="idxS" class="hidden"><div class="progress"><i id="idxP"></i></div><div class="small muted" id="idxT"></div></div>
      <p class="small muted" style="margin-top:0">Cargá los dorsales separados por coma (ej: <code>112, 140</code>). Se guarda solo al salir del campo.</p>
      <div class="aph">${photos.map(p => `
        <div class="it" data-id="${p.id}"><img src="${api.thumb(p)}" alt="" loading="lazy">
          <div class="b">
            <input type="text" data-k="bibs" inputmode="numeric" placeholder="Dorsales" value="${esc((p.bibs || []).join(', '))}">
            <input type="text" data-k="tag" placeholder="Etiqueta" value="${esc(p.tag || '')}">
            <div class="row"><span class="small muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.faces_indexed ? `🙂 ${p.faces_count ?? 0} · ` : ''}${esc(p.file_name || '')}</span>
            <button class="btn sm ghost" data-cov title="Usar como portada">★</button><button class="btn sm ghost" data-del title="Eliminar">🗑</button></div>
          </div></div>`).join('')}</div>
    </div></div>`;
  const f = $('#evf');
  f.onsubmit = async e => { e.preventDefault(); const saved = await api.saveEvent(readEventForm(f, { id: ev.id, cover_path: ev.cover_path, cover_id: ev.cover_id })); evCache[id] = saved || null; toast('Evento guardado'); };
  $('#evdel').onclick = async () => {
    if (!confirm(`¿Eliminar "${ev.title}" y sus ${photos.length} fotos? No se puede deshacer.`)) return;
    await api.deleteEvent(ev, photos); delete evCache[id]; delete phCache[id]; adminTab = 'eventos'; location.hash = '#/admin';
  };
  $$('.aph .it', app).forEach(it => {
    const p = photos.find(x => x.id === it.dataset.id);
    $$('input', it).forEach(inp => inp.onchange = async () => {
      const patch = inp.dataset.k === 'bibs' ? { bibs: inp.value.split(/[,\s]+/).map(digits).filter(Boolean) } : { tag: inp.value.trim() || null };
      await api.updatePhoto(p.id, patch); Object.assign(p, patch); toast('Guardado', 1200);
    });
    $('[data-del]', it).onclick = async () => { if (!confirm('¿Eliminar esta foto?')) return; await api.deletePhoto(p); it.remove(); delete phCache[id]; };
    $('[data-cov]', it).onclick = async () => { await api.saveEvent({ ...ev, cover_path: p.thumb_path || null, cover_id: p.id }); ev.cover_path = p.thumb_path; ev.cover_id = p.id; delete evCache[id]; toast('Portada actualizada'); };
  });
  $('#upF').onchange = async e => {
    const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (!files.length) return;
    const tag = $('#upTag').value.trim(), bibs = $('#upBib').value.split(/[,\s]+/).map(digits).filter(Boolean);
    const faceOpts = $('#upFace').checked ? { tiles: $('#upTiles').checked } : null;
    $('#upS').classList.remove('hidden');
    if (faceOpts) { $('#upT').textContent = 'Cargando el detector de caras…'; try { await FACE.nets(['ssdMobilenetv1', 'faceLandmark68Net', 'faceRecognitionNet']); } catch (ex) { toast(ex.message); } }
    let done = 0, fail = 0, first = null; const start = photos.length, total = files.length;
    const upd = () => { $('#upP').style.width = (done / total * 100) + '%'; $('#upT').textContent = `${done} de ${total} subidas${fail ? ` · ${fail} con error` : ''}… no cierres esta pestaña.`; };
    upd();
    let next = 0;
    const worker = async () => {
      while (next < files.length) {
        const i = next++, file = files[i];
        try {
          const v = await makeVersions(file, wmText(), faceOpts);
          const p = await api.addPhoto(id, file, v, { tag, bibs, sort: start + i });
          if (!first) first = p;
        } catch (ex) { console.error(ex); fail++; }
        done++; upd();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (first && !ev.cover_path && !ev.cover_id) await api.saveEvent({ ...ev, cover_path: first.thumb_path || null, cover_id: first.id });
    delete evCache[id];
    toast(`Listo: ${done - fail} fotos subidas${fail ? `, ${fail} fallaron` : ''}`, 3500);
    adminEvent(id);
  };
  const idx = $('#idx'); if (idx) idx.onclick = async () => {
    const pend = photos.filter(p => !p.faces_indexed), tiles = $('#upTiles').checked;
    idx.disabled = true; $('#idxS').classList.remove('hidden');
    let done = 0, fail = 0, faces = 0;
    const upd = () => { $('#idxP').style.width = (done / pend.length * 100) + '%'; $('#idxT').textContent = `${done} de ${pend.length} fotos · ${faces} caras encontradas${fail ? ` · ${fail} con error` : ''}… no cierres esta pestaña.`; };
    upd();
    for (const p of pend) { // de a una: el detector usa la placa de video
      try { const src = await api.originalImage(p); const f = await FACE.detectAll(src, { tiles }); if (src.close) src.close(); await api.saveFaces(p, f); faces += f.length; }
      catch (ex) { console.error(ex); fail++; }
      done++; upd();
    }
    toast(`Listo: ${faces} caras en ${done - fail} fotos`, 3500); adminEvent(id);
  };
}

async function adminLive(pane) {
  const sch = await api.schedule();
  pane.innerHTML = `
    <form class="card" id="lvf" style="margin-bottom:14px">
      <h3>Transmisión actual</h3>
      <p class="small muted" style="margin-top:-4px">Pegá el link del vivo de YouTube (o el ID del canal, que empieza con "UC"). Con otros servicios se muestra un botón al link.</p>
      <label class="switch"><input type="checkbox" name="live_active" ${SET.live_active ? 'checked' : ''}> <span>Estoy transmitiendo AHORA</span></label>
      <label class="f"><span>Título</span><input type="text" name="live_title" value="${esc(SET.live_title || '')}" placeholder="Copa Paraná SUP — Fecha 4, Largada Élite"></label>
      <label class="f"><span>Link del vivo</span><input type="url" name="live_url" value="${esc(SET.live_url || '')}" placeholder="https://www.youtube.com/live/XXXXXXXXXXX"></label>
      <button class="btn">Guardar</button>
    </form>
    <div class="card">
      <h3>Agenda</h3>
      <ul class="sched">${sch.map(s => `<li><div style="flex:1"><b>${esc(s.title)}</b><div class="small muted">${fmtDT(s.starts_at)}</div></div><button class="btn sm ghost" data-d="${s.id}">🗑</button></li>`).join('') || '<li class="muted">Sin fechas.</li>'}</ul>
      <form id="scf" class="grid2" style="margin-top:12px">
        <label class="f"><span>Título</span><input type="text" name="title" required></label>
        <label class="f"><span>Fecha y hora</span><input type="datetime-local" name="at" required></label>
        <div><button class="btn sm">+ Agregar fecha</button></div>
      </form>
    </div>`;
  $('#lvf').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const patch = { live_active: f.live_active.checked, live_title: f.live_title.value.trim(), live_url: f.live_url.value.trim() };
    if (patch.live_active && !patch.live_url) return toast('Cargá el link del vivo');
    SET = { ...SET, ...(await api.saveSettings(patch) || patch) }; renderChrome(); toast('Guardado');
  };
  $('#scf').onsubmit = async e => { e.preventDefault(); await api.addSchedule({ title: e.target.title.value.trim(), starts_at: new Date(e.target.at.value).toISOString() }); adminLive(pane); };
  $$('[data-d]', pane).forEach(b => b.onclick = async () => { await api.delSchedule(b.dataset.d); adminLive(pane); });
}

async function adminSettings(pane) {
  const s = SET;
  const fld = (k, l, t = 'text', ph = '') => `<label class="f"><span>${l}</span><input type="${t}" name="${k}" value="${esc(s[k] ?? '')}" placeholder="${esc(ph)}" ${t === 'number' ? 'min="0" step="1"' : ''}></label>`;
  pane.innerHTML = `<form class="card" id="stf">
    <h3>Marca</h3>
    <div class="brandprev">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="Logo">` : '<span class="small muted">Sin logo cargado</span>'}
      <label class="btn sm ghost" style="cursor:pointer">Subir logo<input type="file" id="logoF" accept="image/png,image/jpeg,image/webp" hidden></label>
      ${s.logo_url ? '<button type="button" class="btn sm ghost" id="logoX">Quitar</button>' : ''}</div>
    <p class="small muted" style="margin-top:-6px">Ideal: PNG con fondo transparente.</p>
    <div class="colorrow">
      <label><input type="color" name="color_primary" value="${esc(s.color_primary || '#0b2540')}"> Color principal</label>
      <label><input type="color" name="color_accent" value="${esc(s.color_accent || '#ff5a36')}"> Color de acento</label>
    </div>
    <div class="grid2">${fld('site_name', 'Nombre de la marca')}${fld('watermark_text', 'Texto de marca de agua', 'text', '© ' + (s.site_name || ''))}</div>
    <label class="f"><span>Frase de portada</span><textarea name="tagline" rows="2">${esc(s.tagline || '')}</textarea></label>
    <div class="grid2">${fld('instagram', 'Instagram (usuario)')}${fld('whatsapp', 'WhatsApp (con 549…)', 'tel', '5493411234567')}</div>
    ${fld('youtube', 'Canal de YouTube (URL)', 'url')}
    <h3 style="margin-top:10px">Quién soy</h3>
    <div class="teaser" style="margin-bottom:12px">${s.about_photo_url ? `<img src="${esc(s.about_photo_url)}" alt="">` : `<div class="ph">${esc((s.site_name || 'F')[0])}</div>`}
      <label class="btn sm ghost" style="cursor:pointer">Subir foto de perfil<input type="file" id="aboutF" accept="image/*" hidden></label></div>
    <div class="grid2">${fld('about_title', 'Título de la sección', 'text', 'Quién soy')}${fld('about_tags', 'Especialidades (separadas por coma)')}</div>
    <label class="f"><span>Presentación (dejá una línea en blanco entre párrafos)</span><textarea name="about_text" rows="7">${esc(s.about_text || '')}</textarea></label>
    <h3 style="margin-top:10px">Cobro por transferencia</h3>
    <div class="grid2">${fld('alias', 'Alias')}${fld('cbu', 'CBU / CVU')}</div>
    ${fld('titular', 'Titular de la cuenta')}
    <h3 style="margin-top:10px">Precios</h3>
    <div class="grid2">${fld('price_photo', 'Precio por foto', 'number')}<div></div>${fld('pack_size', 'Fotos por pack (opcional)', 'number')}${fld('pack_price', 'Precio del pack', 'number')}</div>
    <p class="small muted" style="margin-top:-4px">Ejemplo con los valores actuales: 7 fotos = ${money(calcTotal(7, s))}. Fórmula: el mínimo entre (packs completos + sueltas) y (redondear para arriba a packs).</p>
    <button class="btn">Guardar ajustes</button>
  </form>`;
  $('#stf').onsubmit = async e => {
    e.preventDefault(); const f = e.target, o = {};
    ['site_name', 'watermark_text', 'tagline', 'instagram', 'whatsapp', 'youtube', 'alias', 'cbu', 'titular', 'about_title', 'about_tags', 'about_text', 'color_primary', 'color_accent'].forEach(k => o[k] = f[k].value.trim() || null);
    o.whatsapp = o.whatsapp ? digits(o.whatsapp) : null;
    ['price_photo', 'pack_size', 'pack_price'].forEach(k => o[k] = f[k].value === '' ? (k === 'price_photo' ? 0 : null) : +f[k].value);
    SET = { ...SET, ...(await api.saveSettings(o) || o) }; renderChrome(); toast('Ajustes guardados');
  };
  // vista previa de colores en vivo
  $$('input[type=color]', pane).forEach(i => i.oninput = () => { SET = { ...SET, [i.name]: i.value }; applyTheme(); });
  const upBrand = async (file, kind, key, max, type) => {
    try {
      toast('Subiendo…');
      const url = await api.uploadBrand(await resizeImage(file, max, type), kind);
      SET = { ...SET, ...(await api.saveSettings({ [key]: url }) || { [key]: url }) }; renderChrome(); adminSettings(pane); toast('Listo');
    } catch (e) { toast(e.message); }
  };
  $('#logoF').onchange = e => e.target.files[0] && upBrand(e.target.files[0], 'logo', 'logo_url', 512, 'image/png');
  $('#aboutF').onchange = e => e.target.files[0] && upBrand(e.target.files[0], 'about', 'about_photo_url', 1000, 'image/jpeg');
  const lx = $('#logoX'); if (lx) lx.onclick = async () => { SET = { ...SET, ...(await api.saveSettings({ logo_url: null }) || { logo_url: null }) }; renderChrome(); adminSettings(pane); };
}

/* =====================================================================
   ROUTER
   ===================================================================== */
async function route() {
  const raw = (location.hash || '#/').slice(1);
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  window.scrollTo(0, 0);
  $('#app').innerHTML = '<div class="spin"></div>';
  renderNav(); updateCartUI();
  try {
    if (!parts.length) await viewHome();
    else if (parts[0] === 'evento' && parts[1]) await viewEvent(parts[1]);
    else if (parts[0] === 'carrito') await viewCart();
    else if (parts[0] === 'pedido' && parts[1]) await viewOrder(parts[1], /nuevo=1/.test(qs || ''));
    else if (parts[0] === 'vivo') await viewLive();
    else if (parts[0] === 'quien-soy') await viewAbout();
    else if (parts[0] === 'admin') await viewAdmin(parts.slice(1).join('/'));
    else await viewHome();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="wrap empty"><h2>Algo salió mal</h2><p>${esc(e.message)}</p><a class="btn" href="#/">Volver al inicio</a></div>`;
  }
  updateCartUI();
}
window.addEventListener('hashchange', route);

(async () => {
  try { SET = await api.settings(); } catch (e) { console.error(e); SET = {}; }
  renderChrome();
  route();
})();
</script>
